<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>YTM — Yoshlar tashabbuslari markazi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#f8fafc;min-height:100vh;padding-bottom:75px}
.hdr{background:linear-gradient(135deg,#1e3a8a,#0f172a);padding:18px 16px;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:10}
.hdr h1{font-size:18px;font-weight:700;color:#fff}
.hdr p{font-size:12px;color:#94a3b8;margin-top:2px}
.wrap{padding:16px;max-width:480px;margin:auto}
.card{background:#1e293b;border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #334155}
label{display:block;font-size:12px;color:#cbd5e1;margin:10px 0 5px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none}
input:focus,select:focus{border-color:#3b82f6}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-weight:600;font-size:15px;margin-top:14px;cursor:pointer}
.btn:active{opacity:.85}
.btn-sec{background:#334155;margin-top:8px}
.btn-ok{background:#059669}
.pass{background:linear-gradient(135deg,#1d4ed8,#0f172a);border:2px dashed #60a5fa;border-radius:18px;padding:18px;text-align:center}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#3b82f6;color:#fff;margin-bottom:8px}
.code-box{background:#0f172a;padding:12px;border-radius:12px;font-family:monospace;font-size:20px;letter-spacing:2px;color:#38bdf8;margin:12px 0;border:1px solid #334155}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.nav button{background:none;border:none;color:#94a3b8;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px}
.nav button.act{color:#60a5fa;font-weight:700}
.hide{display:none}
.item{background:#0f172a;padding:12px;border-radius:12px;margin-top:8px;border:1px solid #334155;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:#0f172a;padding:12px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat b{font-size:20px;color:#38bdf8;display:block}
</style>
</head>
<body>

<div class="hdr">
  <h1>YTM — Yoshlar tashabbuslari markazi</h1>
  <p>Tadbirlar va elektron ruxsatnoma tizimi</p>
</div>

<div class="wrap">
  <!-- 1. RO'YXATDAN O'TISH -->
  <div id="v-reg">
    <div class="card">
      <h2 style="font-size:16px;margin-bottom:4px">Tadbirga ro‘yxatdan o‘tish</h2>
      <p style="font-size:12px;color:#94a3b8">Ma’lumotlarni kiriting va QR/ID ruxsatnoma oling</p>
      <form id="regForm">
        <label>F.I.Sh (To‘liq ism-sharif)</label>
        <input id="fn" required placeholder="Masalan: Aliyev Sardor">
        <label>Telefon raqam</label>
        <input id="ph" type="tel" required placeholder="+998 90 123 45 67">
        <label>Yo‘nalish</label>
        <select id="tr">
          <option value="TECH">TECH — IT va Startaplar</option>
          <option value="BIZNES">BIZNES — Tadbirkorlik</option>
          <option value="KREATIV">KREATIV — Media va Dizayn</option>
          <option value="VOLONTYOR">VOLONTYOR — Ijtimoiy loyihalar</option>
          <option value="KARYERA">KARYERA — Ta’lim va Bandlik</option>
        </select>
        <label>Hudud / Tuman</label>
        <input id="rg" required placeholder="Masalan: Toshkent sh.">
        <button class="btn" type="submit">Ruxsatnoma olish</button>
      </form>
    </div>
  </div>

  <!-- 2. MENING RUXSATNOMAM -->
  <div id="v-pass" class="hide">
    <div id="passBox"></div>
  </div>

  <!-- 3. ADMIN PANEL -->
  <div id="v-adm" class="hide">
    <div id="admLogin" class="card">
      <h2 style="font-size:16px">Admin kirish</h2>
      <label>PIN kod (2026)</label>
      <input id="pinIn" type="password" inputmode="numeric" placeholder="••••">
      <button class="btn" onclick="loginAdm()">Kirish</button>
    </div>

    <div id="admPanel" class="hide">
      <div class="stat">
        <div><b id="stAll">0</b><span style="font-size:11px;color:#94a3b8">Jami ishtirokchi</span></div>
        <div><b id="stIn">0</b><span style="font-size:11px;color:#94a3b8">Tasdiqlangan</span></div>
      </div>
      <div class="card">
        <select id="flt" onchange="renderAdm()">
          <option value="ALL">Barcha yo‘nalishlar</option>
          <option value="TECH">TECH</option>
          <option value="BIZNES">BIZNES</option>
          <option value="KREATIV">KREATIV</option>
          <option value="VOLONTYOR">VOLONTYOR</option>
          <option value="KARYERA">KARYERA</option>
        </select>
        <button class="btn btn-ok" onclick="expCSV()">CSV yuklab olish</button>
        <div id="admList"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav">
  <button id="n-reg" class="act" onclick="tab('reg')">📝 Ro‘yxat</button>
  <button id="n-pass" onclick="tab('pass')">🎫 Ruxsatnoma</button>
  <button id="n-adm" onclick="tab('adm')">🔐 Admin</button>
</div>

<script>
const KEY='ytm_users_2026';
let users=JSON.parse(localStorage.getItem(KEY)||'[]');
let myId=localStorage.getItem('ytm_my_id')||'';

const m={name:"YTM App",short_name:"YTM",start_url:"./",display:"standalone",background_color:"#0f172a",theme_color:"#0f172a",icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='63' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>YTM</text></svg>",sizes:"192x192",type:"image/svg+xml"}]};
const lnk=document.createElement('link');lnk.rel='manifest';lnk.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(lnk);

function save(){localStorage.setItem(KEY,JSON.stringify(users));}

function tab(t){
  ['reg','pass','adm'].forEach(x=>{
    document.getElementById('v-'+x).classList.toggle('hide',x!==t);
    document.getElementById('n-'+x).classList.toggle('act',x===t);
  });
  if(t==='pass')renderPass();
  if(t==='adm')renderAdm();
}

document.getElementById('regForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id='YTM-'+Math.floor(100000+Math.random()*900000);
  const u={
    id,
    name:document.getElementById('fn').value.trim(),
    phone:document.getElementById('ph').value.trim(),
    track:document.getElementById('tr').value,
    region:document.getElementById('rg').value.trim(),
    checked:false,
    time:new Date().toLocaleString('uz-UZ')
  };
  users.unshift(u);
  myId=id;
  localStorage.setItem('ytm_my_id',id);
  save();
  e.target.reset();
  tab('pass');
});

function renderPass(){
  const box=document.getElementById('passBox');
  const u=users.find(x=>x.id===myId)||users[0];
  if(!u){
    box.innerHTML='<div class="card"><p style="text-align:center;color:#94a3b8">Hali ruxsatnoma olinmagan. Avval ro‘yxatdan o‘ting.</p></div>';
    return;
  }
  box.innerHTML=`
    <div class="pass">
      <span class="badge">${u.track}</span>
      <h2 style="font-size:19px">${u.name}</h2>
      <p style="font-size:13px;color:#cbd5e1;margin-top:4px">${u.region} • ${u.phone}</p>
      <div class="code-box">${u.id}</div>
      <p style="font-size:12px;color:${u.checked?'#4ade80':'#fbbf24'}">
        ${u.checked?'✅ Kirish tasdiqlangan':'⏳ Kirish kutilmoqda'}
      </p>
      <p style="font-size:11px;color:#94a3b8;margin-top:8px">${u.time}</p>
    </div>`;
}

function loginAdm(){
  if(document.getElementById('pinIn').value==='2026'){
    document.getElementById('admLogin').classList.add('hide');
    document.getElementById('admPanel').classList.remove('hide');
    renderAdm();
  }else{alert('PIN noto‘g‘ri!');}
}

function toggleChk(id){
  const u=users.find(x=>x.id===id);
  if(u){u.checked=!u.checked;save();renderAdm();}
}

function renderAdm(){
  const f=document.getElementById('flt').value;
  const list=f==='ALL'?users:users.filter(x=>x.track===f);
  document.getElementById('stAll').textContent=users.length;
  document.getElementById('stIn').textContent=users.filter(x=>x.checked).length;
  const el=document.getElementById('admList');
  if(!list.length){el.innerHTML='<p style="color:#94a3b8;font-size:13px;margin-top:12px">Ro‘yxat bo‘sh.</p>';return;}
  el.innerHTML=list.map(u=>`
    <div class="item">
      <div class="row">
        <div>
          <b>${u.name}</b> <span style="color:#60a5fa;font-size:11px">[${u.track}]</span>
          <div style="color:#94a3b8;font-size:12px">${u.id} • ${u.phone}</div>
        </div>
        <button onclick="toggleChk('${u.id}')" style="padding:6px 10px;border-radius:8px;border:none;background:${u.checked?'#059669':'#334155'};color:#fff;font-size:12px">
          ${u.checked?'Keldi ✓':'Tasdiqlash'}
        </button>
      </div>
    </div>`).join('');
}

function expCSV(){
  const rows=[['ID','F.I.Sh','Telefon','Yonalish','Hudud','Holat','Vaqt'],...users.map(u=>[u.id,u.name,u.phone,u.track,u.region,u.checked?'Tasdiqlangan':'Kutilmoqda',u.time])];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='ytm_ishtirokchilar.csv';
  a.click();
}
</script>
</body>
</html>
